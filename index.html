<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>साईट लेजर — Builder ERP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#1E2320; --panel:#F2ECDF; --panelDark:#26302B; --ink:#221F19;
  --sub:#6B6152; --line:#D9D0BC; --orange:#E2571C; --steel:#3E5C66;
  --green:#4C7A45; --red:#B23A2E; --amber:#C68A1E;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);}
input,select,button{font-family:'Inter',sans-serif;}
::placeholder{color:var(--sub);opacity:.7;}
.hidden{display:none !important;}
.wrap{max-width:1150px;margin:0 auto;padding:0 20px;}
h1,h2,h3{margin:0;}
.font-display{font-family:'Oswald',sans-serif;}
.font-mono{font-family:'IBM Plex Mono',monospace;}

#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:var(--panel);border-radius:6px;padding:28px;max-width:380px;width:100%;}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;font-size:14px;margin-bottom:10px;background:#fff;color:var(--ink);}
.btn-primary{background:var(--orange);color:#fff;border:none;padding:11px 0;border-radius:4px;font-weight:600;font-size:14px;width:100%;cursor:pointer;}
.btn-primary:disabled{opacity:.6;}
.err-text{color:var(--red);font-size:12.5px;margin-bottom:10px;}
.switch-link{color:var(--steel);font-weight:600;cursor:pointer;}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.lang-toggle button{background:#fff;border:none;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;color:var(--sub);}
.lang-toggle button.active{background:var(--orange);color:#fff;}
.lang-toggle-dark{border-color:#3A443E;}
.lang-toggle-dark button{background:transparent;color:#9B9384;}
.lang-toggle-dark button.active{background:var(--orange);color:#fff;}

#appHeader{padding:20px 0 0 0;position:relative;}
.brand-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-dot{width:10px;height:10px;background:var(--orange);transform:rotate(45deg);}
.brand-text{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:#B7AF9E;text-transform:uppercase;}
.user-row{display:flex;align-items:center;gap:14px;color:#B7AF9E;font-size:12px;}
.logout-btn{display:flex;align-items:center;gap:4px;background:none;border:none;color:#B7AF9E;cursor:pointer;font-size:12px;}
.app-title{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--panel);margin:0 0 16px 0;}

.tabs{display:flex;gap:6px;flex-wrap:nowrap;border-bottom:1px solid #3A443E;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{display:flex;align-items:center;gap:7px;background:transparent;border:none;cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;color:#9B9384;border-bottom:2px solid transparent;flex:0 0 auto;white-space:nowrap;border-radius:4px 4px 0 0;}
.tab-btn.active{color:var(--orange);border-bottom:2px solid var(--orange);}
.tab-btn:hover{color:#D8CEB9;}
.tab-btn.active:hover{color:var(--orange);}

.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.subtab-btn{background:#fff;border:1px solid var(--line);color:var(--sub);padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;}
.subtab-btn.active{background:var(--ink);color:var(--panel);border-color:var(--ink);}

.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:20px;}
.type-card{background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:14px 10px;text-align:center;cursor:pointer;}
.type-card .ic{font-size:20px;display:block;margin-bottom:6px;}
.type-card .lb{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;}
.type-card.active{border-color:var(--orange);background:#FBF0EA;box-shadow:0 0 0 1px var(--orange);}

#bodyPanel{background:var(--panel);min-height:calc(100vh - 140px);}
#bodyInner{max-width:1150px;margin:0 auto;padding:24px 20px 60px 20px;}
.section{margin-bottom:28px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap;gap:8px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--sub);text-transform:uppercase;}
.section-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;color:var(--ink);}

.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.stat-card{background:#fff;border:1px solid var(--line);padding:16px 18px;border-radius:4px;flex:1 1 200px;}
.stat-label{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:11.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.stat-value{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;color:var(--ink);}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px;cursor:pointer;}
.card-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;color:var(--ink);}
.card-sub{font-size:12px;color:var(--sub);margin-bottom:10px;}
.card-amount{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;}
.card-count{font-size:11.5px;color:var(--sub);}

.chart-box{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px;height:260px;}
.empty-note{background:#fff;border:1px dashed var(--line);padding:32px 20px;border-radius:4px;color:var(--sub);font-size:14px;text-align:center;}

.list-panel{background:#fff;border:1px solid var(--line);border-radius:4px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid var(--line);}
.list-row:first-child{border-top:none;}
.list-row.clickable{cursor:pointer;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--sub);border-radius:4px;padding:4px;}

.chip{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:12.5px;}
.chip b{color:var(--ink);font-weight:600;}
.chip .amt{color:var(--sub);font-family:'IBM Plex Mono',monospace;}

.back-btn{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--steel);font-weight:600;font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;}

.stamp{display:inline-block;border:2px solid var(--green);color:var(--green);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.12em;padding:2px 8px;border-radius:3px;transform:rotate(-3deg);text-transform:uppercase;white-space:nowrap;}
.stamp.pending{border-color:var(--red);color:var(--red);}

.print-btn{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--steel);padding:7px 12px;border-radius:4px;font-weight:600;font-size:12.5px;cursor:pointer;}

.txn-table-wrap{background:#fff;border:1px solid var(--line);border-radius:4px;overflow-x:auto;}
.txn-table{min-width:900px;width:100%;}
.txn-head,.txn-row{display:grid;grid-template-columns:85px 1fr 95px 85px 90px 95px 90px 150px 30px;align-items:center;}
.txn-head{padding:9px 14px;background:var(--panelDark);color:var(--panel);font-size:10.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;}
.txn-row{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;}
.txn-row .name{font-weight:600;color:var(--ink);}
.txn-row .meta{font-size:10px;color:var(--sub);font-weight:400;}
.right{text-align:right;font-family:'IBM Plex Mono',monospace;}

.form-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:20px;max-width:560px;}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-label{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:600;font-size:12.5px;border:1.5px solid var(--line);background:#fff;color:var(--sub);}
.pill.active-amber{border-color:var(--amber);background:#FBF2E1;color:var(--amber);}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.mode-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:4px;cursor:pointer;font-weight:600;font-size:11px;border:1.5px solid var(--line);background:#fff;color:var(--sub);}
.mode-btn.active{border-color:var(--steel);background:#EAF0F2;color:var(--steel);}
.status-row{display:flex;gap:10px;}
.status-btn{flex:1;padding:9px 0;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--sub);}
.status-btn.paid-active{border-color:var(--green);background:#EAF3E8;color:var(--green);}
.status-btn.pending-active{border-color:var(--red);background:#F7E9E7;color:var(--red);}
.small-btn{color:#fff;border:none;padding:9px 16px;border-radius:4px;font-weight:600;font-size:13px;cursor:pointer;width:100%;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 20px;border-radius:6px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:40;}
.loader{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.print-only{display:none;}
@media print{ .no-print{display:none !important;} body{background:#fff !important;} .print-only{display:block !important;margin-bottom:16px;} }

/* polish */
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#C9C0AF;border-radius:4px;}
*{ -webkit-tap-highlight-color: transparent; }
#bodyInner{animation:fadeIn .2s ease;}
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
.card, .stat-card, .list-panel, .form-card, .chip, .txn-table-wrap, .chart-box, .auth-card, .type-card{
  box-shadow:0 1px 2px rgba(34,31,25,0.04);
  transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
}
.card:hover, .type-card:hover, .list-row.clickable:hover{ box-shadow:0 4px 14px rgba(34,31,25,0.10); transform: translateY(-1px); border-color:#c7bda3; }
.card:active{ transform:translateY(0); }
.list-row{ transition: background .15s ease; }
.list-row:hover{ background:#FAF8F2; }
.btn-primary, .small-btn, .print-btn, .status-btn, .pill, .mode-btn, .tab-btn, .subtab-btn, .icon-btn{ transition: filter .15s ease, transform .1s ease, background .15s ease, border-color .15s ease, color .15s ease; }
.btn-primary:hover, .small-btn:hover{ filter:brightness(1.06); }
.btn-primary:active, .small-btn:active{ transform:scale(0.98); }
.icon-btn:hover{ background:#F0EAD9; color:var(--red); }
input, select{ transition: border-color .15s ease, box-shadow .15s ease; }
input:focus, select:focus{ outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(226,87,28,0.14); }
#appHeader::after{ content:""; position:absolute; right:0; top:0; bottom:0; width:24px; background:linear-gradient(to right, transparent, var(--bg) 85%); pointer-events:none; }
.section{ animation:fadeIn .22s ease; }
@media (max-width:480px){
  .wrap, #bodyInner{ padding-left:14px; padding-right:14px; }
  .app-title{ font-size:23px; }
  .stat-card{ flex:1 1 45%; }
  .form-grid2{ grid-template-columns:1fr !important; }
  .txn-head, .txn-row{ font-size:11px; }
}
</style>
</head>
<body>

<div id="loader" class="loader"><svg class="spin" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E2571C" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2 A10 10 0 0 1 22 12"/></svg></div>

<div id="authScreen" class="hidden">
  <div class="auth-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="brand" style="margin-bottom:0;"><div class="brand-dot" style="width:9px;height:9px;"></div><span class="eyebrow">साईट लेजर</span></div>
      <div class="lang-toggle" id="authLangToggle"></div>
    </div>
    <h3 class="font-display" id="authTitle" style="font-size:22px;margin:2px 0 18px 0;">लॉगिन करा</h3>
    <input id="authFullName" class="field hidden" placeholder="पूर्ण नाव">
    <input id="authEmail" class="field" type="email" placeholder="ईमेल">
    <input id="authPassword" class="field" type="password" placeholder="पासवर्ड (किमान ६ अक्षरं)">
    <div id="authErr" class="err-text hidden"></div>
    <button id="authSubmitBtn" class="btn-primary" style="margin-bottom:12px;">लॉगिन</button>
    <div style="text-align:center;font-size:12.5px;color:var(--sub);" id="authSwitchRow">अकाउंट नाही? <span class="switch-link" onclick="toggleAuthMode()">नवीन बनवा</span></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="appHeader" class="no-print wrap">
    <div class="brand-row">
      <div class="brand"><div class="brand-dot"></div><span class="brand-text">साईट लेजर — Builder ERP</span></div>
      <div class="user-row">
        <div class="lang-toggle lang-toggle-dark" id="mainLangToggle"></div>
        <span id="meName"></span>
        <button class="logout-btn" onclick="logout()">⏻ <span id="logoutLbl">लॉगआउट</span></button>
      </div>
    </div>
    <h1 class="app-title" id="appTitleLbl">कंपनी खर्च नोंदवही</h1>
    <div class="tabs" id="tabs">
      <button class="tab-btn" data-tab="dashboard" onclick="switchTab('dashboard')">📊 <span></span></button>
      <button class="tab-btn" data-tab="entry" onclick="switchTab('entry')">✍️ <span></span></button>
      <button class="tab-btn" data-tab="masters" onclick="switchTab('masters')">🗂️ <span></span></button>
      <button class="tab-btn" data-tab="reports" onclick="switchTab('reports')">📋 <span></span></button>
    </div>
  </div>
  <div id="bodyPanel"><div id="bodyInner"></div></div>
</div>

<div id="toast" class="hidden no-print"></div>

<script>
/* ================= i18n ================= */
const STR = {
  navDashboard:{mr:"डॅशबोर्ड",en:"Dashboard"}, navEntry:{mr:"नोंद करा",en:"Entry"}, navMasters:{mr:"मास्टर्स",en:"Masters"}, navReports:{mr:"रिपोर्ट्स",en:"Reports"},
  appTitle:{mr:"कंपनी खर्च नोंदवही",en:"Company Ledger"}, logout:{mr:"लॉगआउट",en:"Logout"},
  entryTitle:{mr:"नवीन नोंद — आधी प्रकार निवडा",en:"New Entry — pick a type first"},
  typePurchase:{mr:"खरेदी / खर्च बिल",en:"Purchase / Expense"}, typeUsage:{mr:"साहित्य वापर",en:"Material Usage"},
  typeAdvance:{mr:"ॲडव्हान्स (सप्लायरला)",en:"Advance to Supplier"}, typeReceipt:{mr:"ग्राहक पावती",en:"Customer Receipt"},
  typeRa:{mr:"RA बिल (कॉन्ट्रॅक्टर)",en:"RA Bill (Contractor)"}, typeMach:{mr:"मशिनरी/व्हेईकल भाडं",en:"Machinery/Vehicle Rent"},
  typeLabor:{mr:"मजूर हजेरी",en:"Labor Attendance"},
  mastersSites:{mr:"साईट्स",en:"Sites"}, mastersSuppliers:{mr:"सप्लायर्स/कॉन्ट्रॅक्टर्स",en:"Suppliers/Contractors"},
  mastersUnits:{mr:"युनिट्स (फ्लॅट्स)",en:"Units (Flats)"}, mastersCustomers:{mr:"कस्टमर्स/बुकिंग",en:"Customers/Bookings"},
  mastersWork:{mr:"कामाचे प्रकार",en:"Work Items"}, mastersDocs:{mr:"डॉक्युमेंट्स",en:"Documents"},
  reportDashboard:{mr:"ओव्हरव्ह्यू",en:"Overview"}, reportSites:{mr:"साईट रिपोर्ट",en:"Site Report"}, reportSuppliers:{mr:"सप्लायर रिपोर्ट",en:"Supplier Report"},
  reportStock:{mr:"स्टॉक शिल्लक",en:"Stock Balance"}, reportSales:{mr:"विक्री स्टेटस",en:"Sales Status"}, reportProgress:{mr:"प्रगती/RA",en:"Progress/RA"},
  reportFinance:{mr:"आर्थिक सारांश",en:"Financial Summary"}, reportMach:{mr:"मशिनरी लॉग",en:"Machinery Log"}, reportLabor:{mr:"मजूर लॉग",en:"Labor Log"},
  site:{mr:"साईट",en:"Site"}, supplier:{mr:"सप्लायर / कॉन्ट्रॅक्टर",en:"Supplier / Contractor"}, category:{mr:"कॅटेगरी",en:"Category"},
  date:{mr:"तारीख",en:"Date"}, amount:{mr:"रक्कम ₹",en:"Amount ₹"}, save:{mr:"जतन करा",en:"Save"}, add:{mr:"जोडा",en:"Add"},
  delete:{mr:"डिलीट",en:"Delete"}, status:{mr:"स्टेटस",en:"Status"}, mode:{mr:"पेमेंट मोड",en:"Payment Mode"},
  billNo:{mr:"बिल नंबर (ऐच्छिक)",en:"Bill No. (optional)"}, gstRate:{mr:"GST दर",en:"GST Rate"},
  itemName:{mr:"साहित्याचं नाव (स्टॉकसाठी, ऐच्छिक)",en:"Item name (for stock, optional)"}, qty:{mr:"प्रमाण",en:"Quantity"}, unit:{mr:"युनिट",en:"Unit"},
  optional:{mr:"(ऐच्छिक)",en:"(optional)"}, noSupplier:{mr:"— सप्लायर नाही (थेट खर्च) —",en:"— No supplier (direct expense) —"},
};
let LANG = "mr";
function t(k){ return (STR[k] && STR[k][LANG]) || (STR[k] && STR[k].mr) || k; }
function setLang(l){
  LANG = l; try{ localStorage.setItem("ledger_lang", l); }catch(e){}
  renderLangToggles(); applyStaticLabels();
  if (document.getElementById("app") && !document.getElementById("app").classList.contains("hidden")) rerenderCurrentTab();
}
function renderLangToggles(){
  const html = '<button class="'+(LANG==="mr"?"active":"")+'" onclick="setLang(\'mr\')">मराठी</button><button class="'+(LANG==="en"?"active":"")+'" onclick="setLang(\'en\')">English</button>';
  const a=document.getElementById("authLangToggle"); if(a) a.innerHTML = html;
  const m=document.getElementById("mainLangToggle"); if(m) m.innerHTML = html;
}
function applyStaticLabels(){
  document.getElementById("appTitleLbl").textContent = t("appTitle");
  document.getElementById("logoutLbl").textContent = t("logout");
  const map = { dashboard:"navDashboard", entry:"navEntry", masters:"navMasters", reports:"navReports" };
  document.querySelectorAll(".tab-btn").forEach(b=>{ const span=b.querySelector("span"); if (span) span.textContent = t(map[b.dataset.tab]); });
}

/* ================= Supabase ================= */
const SUPABASE_URL = "https://yxexwqdihekuehaepkoi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4ZXh3cWRpaGVrdWVoYWVwa29pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDkwNzgsImV4cCI6MjEwMTc4NTA3OH0.W-pV3PhF6dq0DFCtSdENpX6mDd6OSn5l3c3fum0oF68";
async function sb(path, { method = "GET", body, token } = {}, _retried) {
  const headers = { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  headers.Authorization = "Bearer " + (token || SUPABASE_ANON_KEY);
  if (body !== undefined) headers.Prefer = "return=representation";
  const res = await fetch(SUPABASE_URL + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    if (res.status === 401 && !_retried && token && state.session && state.session.refresh_token) {
      try {
        const fresh = await apiRefresh(state.session.refresh_token);
        if (fresh && fresh.access_token) { state.session = fresh; lsSet("ledger_refresh_token", fresh.refresh_token); return sb(path, { method, body, token: fresh.access_token }, true); }
      } catch (e) {}
      logout(); showToast("सेशन एक्सपायर झालं, परत लॉगिन करा");
    }
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.error_description || j.msg || j.message || msg; } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const apiSignUp = (email, password, full_name) => sb("/auth/v1/signup", { method: "POST", body: { email, password, data: { full_name } } });
const apiSignIn = (email, password) => sb("/auth/v1/token?grant_type=password", { method: "POST", body: { email, password } });

const ALIAS_MAP = {};
COMMON_ITEMS.forEach(it=>{ ALIAS_MAP[it.name.trim().toLowerCase()] = it; (it.alias||[]).forEach(a=>{ ALIAS_MAP[a.trim().toLowerCase()] = it; }); });
function buildItemDatalist(id, extraNames){
  const names = new Set(); COMMON_ITEMS.forEach(it=>{ names.add(it.name); (it.alias||[]).forEach(a=>names.add(a)); }); (extraNames||[]).forEach(n=>{ if(n) names.add(n); });
  return '<datalist id="'+id+'">'+[...names].map(n=>'<option value="'+esc(n)+'">').join("")+'</datalist>';
}
function handleItemInput(formObj, itemFieldId, unitFieldId){
  const key = (formObj.itemName||"").trim().toLowerCase(); const match = ALIAS_MAP[key];
  if (match) { formObj.itemName = match.name; if (!formObj.unit) formObj.unit = match.unit;
    const itemEl=document.getElementById(itemFieldId); if(itemEl) itemEl.value=formObj.itemName;
    const unitEl=document.getElementById(unitFieldId); if(unitEl) unitEl.value=formObj.unit; }
}

/* ================= Boot ================= */
window.addEventListener("DOMContentLoaded", boot);
async function boot(){
  const savedLang = lsGet("ledger_lang"); if (savedLang) LANG = savedLang;
  renderLangToggles();
  const rt = lsGet("ledger_refresh_token");
  if (rt) { try { const data = await apiRefresh(rt); if (data && data.access_token) { state.session = data; lsSet("ledger_refresh_token", data.refresh_token); } } catch(e) {} }
  document.getElementById("loader").classList.add("hidden");
  if (state.session) { document.getElementById("app").classList.remove("hidden"); applyStaticLabels(); await loadAll(); switchTab("dashboard"); }
  else { document.getElementById("authScreen").classList.remove("hidden"); }
}

/* ================= Auth UI ================= */
function toggleAuthMode(){
  state.authMode = state.authMode === "login" ? "signup" : "login";
  document.getElementById("authTitle").textContent = state.authMode === "login" ? "लॉगिन करा" : "नवीन अकाउंट";
  document.getElementById("authFullName").classList.toggle("hidden", state.authMode !== "signup");
  document.getElementById("authSubmitBtn").textContent = state.authMode === "login" ? "लॉगिन" : "अकाउंट तयार करा";
  document.getElementById("authSwitchRow").innerHTML = state.authMode === "login" ? 'अकाउंट नाही? <span class="switch-link" onclick="toggleAuthMode()">नवीन बनवा</span>' : 'आधीच अकाउंट आहे? <span class="switch-link" onclick="toggleAuthMode()">लॉगिन करा</span>';
}
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("authSubmitBtn").addEventListener("click", submitAuth);
  document.getElementById("authPassword").addEventListener("keydown", e => { if(e.key==="Enter") submitAuth(); });
});
async function submitAuth(){
  const errEl = document.getElementById("authErr"); errEl.classList.add("hidden");
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const fullName = document.getElementById("authFullName").value.trim();
  const btn = document.getElementById("authSubmitBtn"); btn.disabled = true; btn.textContent = "...";
  try {
    let data;
    if (state.authMode === "signup") { if (!fullName) throw new Error("तुमचं नाव भरा."); data = await apiSignUp(email, password, fullName); }
    else { data = await apiSignIn(email, password); }
    if (!data || !data.access_token) throw new Error("ईमेल कन्फर्मेशन आवश्यक असू शकतं.");
    state.session = data; lsSet("ledger_refresh_token", data.refresh_token);
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    applyStaticLabels();
    await loadAll(); switchTab("dashboard");
  } catch(e) { errEl.textContent = e.message || "काहीतरी चुकलं."; errEl.classList.remove("hidden"); }
  finally { btn.disabled = false; btn.textContent = state.authMode === "login" ? "लॉगिन" : "अकाउंट तयार करा"; }
}
function logout(){
  state.session = null; lsDel("ledger_refresh_token");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
}

/* ================= Mapping ================= */
function mapSite(r){ return { id:r.id, name:r.name, location:r.location, budget: r.budget!=null ? Number(r.budget) : null }; }
function mapSupplier(r){ return { id:r.id, name:r.name, category:r.category, contact:r.contact, gstin:r.gstin }; }
function mapTxn(r, profMap){
  return { id:r.id, siteId:r.site_id, supplierId:r.supplier_id, category:r.category,
    taxableAmount:Number(r.taxable_amount||0), gstRate:Number(r.gst_rate||0), gstAmount:Number(r.gst_amount||0), totalAmount:Number(r.total_amount||0),
    billNo:r.bill_no, date:r.txn_date, status:r.status, mode:r.mode, itemName:r.item_name||"", quantity: r.quantity!=null?Number(r.quantity):null, unit:r.unit||"",
    enteredBy:(profMap && profMap[r.entered_by]) || "—" };
}
function mapUsage(r){ return { id:r.id, siteId:r.site_id, itemName:r.item_name, quantity:Number(r.quantity||0), unit:r.unit||"", date:r.usage_date, note:r.note||"", value:r.value!=null?Number(r.value):null }; }
function mapAdvance(r){ return { id:r.id, supplierId:r.supplier_id, siteId:r.site_id, amount:Number(r.amount||0), date:r.adv_date, mode:r.mode, note:r.note||"" }; }
function mapUnit(r){ return { id:r.id, siteId:r.site_id, unitNo:r.unit_no, unitType:r.unit_type, area:r.area_sqft!=null?Number(r.area_sqft):null, price:r.price!=null?Number(r.price):null, status:r.status }; }
function mapCustomer(r){ return { id:r.id, unitId:r.unit_id, name:r.name, contact:r.contact, email:r.email, bookingDate:r.booking_date, agreementValue:Number(r.agreement_value||0), note:r.note||"" }; }
function mapReceipt(r){ return { id:r.id, customerId:r.customer_id, amount:Number(r.amount||0), date:r.receipt_date, mode:r.mode, note:r.note||"" }; }
function mapWorkItem(r){ return { id:r.id, siteId:r.site_id, workName:r.work_name, contractorId:r.contractor_id, totalQty:r.total_qty!=null?Number(r.total_qty):null, unit:r.unit||"", rate:r.rate!=null?Number(r.rate):null, retentionPct:Number(r.retention_pct||0) }; }
function mapRaBill(r){ return { id:r.id, workItemId:r.work_item_id, billNo:r.bill_no, date:r.bill_date, cumulativeQty:Number(r.cumulative_qty||0), cumulativeValue:Number(r.cumulative_value||0), retentionAmount:Number(r.retention_amount||0), previousPaid:Number(r.previous_paid||0), netPayable:Number(r.net_payable||0), status:r.status, note:r.note||"" }; }
function mapMachinery(r){ return { id:r.id, siteId:r.site_id, machineName:r.machine_name, rate:r.rate!=null?Number(r.rate):null, rateUnit:r.rate_unit, qty:r.qty!=null?Number(r.qty):null, fuelCost:Number(r.fuel_cost||0), totalCost:Number(r.total_cost||0), date:r.log_date, mode:r.mode, status:r.status, note:r.note||"" }; }
function mapLabor(r){ return { id:r.id, siteId:r.site_id, workerName:r.worker_name, category:r.category||"", date:r.att_date, days:Number(r.days||1), wageRate:r.wage_rate!=null?Number(r.wage_rate):null, wageAmount:Number(r.wage_amount||0), status:r.status, note:r.note||"" }; }
function mapDocument(r){ return { id:r.id, siteId:r.site_id, docName:r.doc_name, category:r.category||"", expiryDate:r.expiry_date, link:r.link||"", note:r.note||"" }; }

/* ================= Load / CRUD ================= */
async function loadAll(){
  const token = state.session.access_token;
  try {
    const [s, sup, t, profRows, use, adv, u, cust, rcpt, wi, ra, mach, lab, docs] = await Promise.all([
      sb("/rest/v1/sites?select=*&order=created_at.asc", {token}),
      sb("/rest/v1/suppliers?select=*&order=created_at.asc", {token}),
      sb("/rest/v1/transactions?select=*&order=txn_date.desc", {token}),
      sb("/rest/v1/profiles?select=id,full_name", {token}),
      sb("/rest/v1/material_usage?select=*&order=usage_date.desc", {token}).catch(()=>[]),
      sb("/rest/v1/advances?select=*&order=adv_date.desc", {token}).catch(()=>[]),
      sb("/rest/v1/units?select=*&order=created_at.asc", {token}).catch(()=>[]),
      sb("/rest/v1/customers?select=*&order=created_at.desc", {token}).catch(()=>[]),
      sb("/rest/v1/receipts?select=*&order=receipt_date.desc", {token}).catch(()=>[]),
      sb("/rest/v1/work_items?select=*&order=created_at.asc", {token}).catch(()=>[]),
      sb("/rest/v1/ra_bills?select=*&order=bill_no.asc", {token}).catch(()=>[]),
      sb("/rest/v1/machinery_log?select=*&order=log_date.desc", {token}).catch(()=>[]),
      sb("/rest/v1/labor_attendance?select=*&order=att_date.desc", {token}).catch(()=>[]),
      sb("/rest/v1/documents?select=*&order=created_at.desc", {token}).catch(()=>[]),
    ]);
    const profMap = {}; (profRows||[]).forEach(p=>{ profMap[p.id]=p.full_name; });
    state.profiles = profMap;
    state.sites = (s||[]).map(mapSite); state.suppliers = (sup||[]).map(mapSupplier); state.txns = (t||[]).map(r=>mapTxn(r, profMap));
    state.usage = (use||[]).map(mapUsage); state.advances = (adv||[]).map(mapAdvance);
    state.units = (u||[]).map(mapUnit); state.customers = (cust||[]).map(mapCustomer); state.receipts = (rcpt||[]).map(mapReceipt);
    state.workItems = (wi||[]).map(mapWorkItem); state.raBills = (ra||[]).map(mapRaBill);
    state.machinery = (mach||[]).map(mapMachinery); state.labor = (lab||[]).map(mapLabor); state.documents = (docs||[]).map(mapDocument);
    document.getElementById("meName").textContent = "👤 " + ((state.session.user.user_metadata||{}).full_name || state.session.user.email);
  } catch(e) { showToast("डेटा लोड करताना त्रुटी: " + e.message); }
}

/* ================= Totals ================= */
function computeTotals(){
  const amt = t => Number(t.totalAmount||0);
  const total = state.txns.reduce((a,x)=>a+amt(x),0);
  const totalGst = state.txns.reduce((a,x)=>a+Number(x.gstAmount||0),0);
  const pending = state.txns.filter(x=>x.status==="pending").reduce((a,x)=>a+amt(x),0);
  const cash = state.txns.filter(x=>x.mode==="cash").reduce((a,x)=>a+amt(x),0);
  const bank = state.txns.filter(x=>x.mode!=="cash").reduce((a,x)=>a+amt(x),0);
  const perSite = state.sites.map(s=>({ site:s, amount: state.txns.filter(x=>x.siteId===s.id).reduce((a,x)=>a+amt(x),0), count: state.txns.filter(x=>x.siteId===s.id).length }));
  const perSupplier = state.suppliers.map(s=>({ supplier:s, amount: state.txns.filter(x=>x.supplierId===s.id).reduce((a,x)=>a+amt(x),0), count: state.txns.filter(x=>x.supplierId===s.id).length })).sort((a,b)=>b.amount-a.amount);
  const perCategory = CATS.map(c=>({ name:c, value: state.txns.filter(x=>x.category===c).reduce((a,x)=>a+amt(x),0) })).filter(c=>c.value>0);
  const directExpense = state.txns.filter(x=>!x.supplierId).reduce((a,x)=>a+amt(x),0);
  return { total, totalGst, pending, cash, bank, perSite, perSupplier, perCategory, directExpense };
}
function computeStock(){
  const map = {};
  state.txns.forEach(t=>{ if (!t.itemName || !t.quantity) return; const key=normItem(t.itemName); map[t.siteId]=map[t.siteId]||{}; map[t.siteId][key]=map[t.siteId][key]||{display:t.itemName,unit:t.unit||"",purchased:0,used:0,usedValue:0}; map[t.siteId][key].purchased += Number(t.quantity); if(t.unit) map[t.siteId][key].unit=t.unit; });
  state.usage.forEach(u=>{ const key=normItem(u.itemName); map[u.siteId]=map[u.siteId]||{}; map[u.siteId][key]=map[u.siteId][key]||{display:u.itemName,unit:u.unit||"",purchased:0,used:0,usedValue:0}; map[u.siteId][key].used += Number(u.quantity); map[u.siteId][key].usedValue += Number(u.value||0); if(u.unit && !map[u.siteId][key].unit) map[u.siteId][key].unit=u.unit; });
  return map;
}

function csvEscape(v){ v=(v==null?"":String(v)); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function downloadBlob(content, filename, type){ const blob=new Blob(["\ufeff"+content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
function exportCSV(txns, filenamePrefix){
  const headers=["Date","Site","Supplier","Category","Item","Qty","Unit","Taxable","GST%","GSTAmt","Total","Mode","Status","BillNo","EnteredBy"];
  const rows=txns.map(t=>{ const site=state.sites.find(s=>s.id===t.siteId); const sup=state.suppliers.find(s=>s.id===t.supplierId); return [t.date,site?site.name:"",sup?sup.name:"",t.category,t.itemName||"",t.quantity||"",t.unit||"",t.taxableAmount,t.gstRate,t.gstAmount,t.totalAmount,modeLabel(t.mode),t.status==="paid"?"PAID":"PENDING",t.billNo||"",t.enteredBy].map(csvEscape).join(","); });
  downloadBlob(headers.join(",")+"\n"+rows.join("\n"), filenamePrefix+"_"+new Date().toISOString().slice(0,10)+".csv", "text/csv;charset=utf-8;");
}

  let html = '<div class="stat-row">'
    + statCard(LANG==="en"?"Total Expense (incl GST)":"एकूण खर्च (GST सह)", inr(totals.total), "--orange", "₹")
    + statCard(LANG==="en"?"Pending Payment":"पेंडिंग पेमेंट", inr(totals.pending), "--red", "⏱")
    + statCard(LANG==="en"?"Total GST":"एकूण GST", inr(totals.totalGst), "--amber", "🧾")
    + '</div><div class="stat-row" style="margin-bottom:30px;">'
    + statCard(LANG==="en"?"Cash":"रोख खर्च", inr(totals.cash), "--steel", "💵")
    + statCard(LANG==="en"?"Bank/UPI/Cheque":"बँक/UPI/चेक", inr(totals.bank), "--green", "🏦")
    + statCard(LANG==="en"?"Sites / Suppliers":"साईट्स / सप्लायर्स", state.sites.length+" / "+state.suppliers.length, "--steel", "🏗")
    + '</div>';

    html += '<div class="empty-note">'+(LANG==="en"?'Start from Masters → add a Site and Supplier, then use Entry to add bills.':'सुरुवात करण्यासाठी "मास्टर्स" मध्ये साईट व सप्लायर जोडा, मग "नोंद करा" मधून एंट्री टाका.')+'</div>';

  html += sectionHtml(LANG==="en"?"Site-wise Spend":"साईट-वाईज खर्च","Site Spend", '<div class="chart-box"><canvas id="siteChart"></canvas></div>');
  let supplierListHtml='<div class="list-panel">'; const top6=totals.perSupplier.slice(0,6);

    + '</div>';

const usageForm = { siteId:null, itemName:"", quantity:"", unit:"", value:"", date:new Date().toISOString().slice(0,10), note:"" };
const advanceForm = { supplierId:null, siteId:"", amount:"", date:new Date().toISOString().slice(0,10), mode:"cash", note:"" };
const receiptForm = { customerId:null, amount:"", date:new Date().toISOString().slice(0,10), mode:"bank", note:"" };
const raForm = { workItemId:null, date:new Date().toISOString().slice(0,10), cumulativeQty:"", note:"" };
const machForm = { siteId:null, machineName:"", rate:"", rateUnit:"per_day", qty:"", fuelCost:"", date:new Date().toISOString().slice(0,10), mode:"cash", status:"pending", note:"" };

function setEntryType(x){ state.entryType = x; renderEntry(); }

function renderEntry(){
  if (state.sites.length===0){
    document.getElementById("bodyInner").innerHTML = sectionHtml(t("navEntry"), "", '<div class="empty-note">'+(LANG==="en"?'First add a Site under Masters.':'आधी "मास्टर्स" मध्ये किमान एक साईट जोडा.')+'</div>');
    return;
  }
  const types = [
    ["purchase","🧾",t("typePurchase")], ["usage","📦",t("typeUsage")], ["advance","🤝",t("typeAdvance")],
    ["receipt","💰",t("typeReceipt")], ["ra","📐",t("typeRa")], ["mach","🚜",t("typeMach")], ["labor","👷",t("typeLabor")],
  ];
  const typeGrid = '<div class="type-grid">'+types.map(([k,ic,lb])=>'<div class="type-card '+(state.entryType===k?"active":"")+'" onclick="setEntryType(\''+k+'\')"><span class="ic">'+ic+'</span><span class="lb">'+esc(lb)+'</span></div>').join("")+'</div>';

  let formHtml = "";
  if (state.entryType==="purchase") formHtml = entryFormPurchase();
  else if (state.entryType==="usage") formHtml = entryFormUsage();
  else if (state.entryType==="advance") formHtml = entryFormAdvance();
  else if (state.entryType==="receipt") formHtml = entryFormReceipt();
  else if (state.entryType==="ra") formHtml = entryFormRa();
  else if (state.entryType==="mach") formHtml = entryFormMach();
  else if (state.entryType==="labor") formHtml = entryFormLabor();

  document.getElementById("bodyInner").innerHTML = sectionHtml(t("navEntry"), t("entryTitle"), typeGrid + formHtml);
}
if (!state.entryType) state.entryType = "purchase";

/* ---- Purchase / Expense ---- */

    + '<div class="form-grid2"><div><label class="form-label">'+t("category")+'</label><select class="field" onchange="addForm.category=this.value">'+catOpts+'</select></div>'
    + '<div><label class="form-label">'+t("date")+'</label><input class="field" type="date" value="'+addForm.date+'" onchange="addForm.date=this.value"></div></div>'
    + '<div class="form-grid2" style="grid-template-columns:1.4fr 1fr .8fr;">'
    + '<div><label class="form-label">'+t("itemName")+'</label><input class="field" list="commonItemList" id="f_itemname" value="'+esc(addForm.itemName)+'" placeholder="e.g. सिमेंट OPC 53 / cement" oninput="addForm.itemName=this.value; handleItemInput(addForm,\'f_itemname\',\'f_unit\');"></div>'

    + '<div><label class="form-label">'+t("unit")+'</label><input class="field" list="unitList" id="f_unit" value="'+esc(addForm.unit)+'" oninput="addForm.unit=this.value;"></div>'

function updateGstPreview(){
  const gstAmount = addForm.taxableAmount ? Math.round(Number(addForm.taxableAmount)*addForm.gstRate/100) : 0;
  const totalAmount = (Number(addForm.taxableAmount)||0)+gstAmount;
  const box = document.getElementById("gstPreviewBox"); if (!box) return;
  box.innerHTML = addForm.taxableAmount>0 ? '<div style="margin-top:8px;font-size:12.5px;color:var(--sub);" class="font-mono">GST: '+inr(gstAmount)+' · <span style="color:var(--ink);font-weight:600;">'+(LANG==="en"?"Total":"एकूण")+': '+inr(totalAmount)+'</span></div>' : '';
}
function setGstRate(r){ addForm.gstRate=r; renderEntry(); const el=document.getElementById("f_amount"); if(el) el.focus(); }
function setMode(m){ addForm.mode=m; renderEntry(); }
function setStatus(s){ addForm.status=s; renderEntry(); }
async function submitTxn(){
  const errEl=document.getElementById("addErr");
  if (!addForm.siteId || !addForm.taxableAmount || Number(addForm.taxableAmount)<=0){ errEl.textContent=LANG==="en"?"Enter site and a valid amount.":"साईट व योग्य रक्कम भरा."; errEl.classList.remove("hidden"); return; }
  const gstAmount=Math.round(Number(addForm.taxableAmount)*addForm.gstRate/100);
  const totalAmount=Number(addForm.taxableAmount)+gstAmount;
  try {
    await addTxn({ siteId:addForm.siteId, supplierId:addForm.supplierId||null, category:addForm.category, taxableAmount:Number(addForm.taxableAmount), gstRate:addForm.gstRate, gstAmount, totalAmount, billNo:addForm.billNo, date:addForm.date, status:addForm.status, mode:addForm.mode, itemName:addForm.itemName, quantity:addForm.quantity, unit:addForm.unit });
    addForm.taxableAmount=""; addForm.billNo=""; addForm.itemName=""; addForm.quantity=""; errEl.classList.add("hidden");
    renderEntry();
  } catch(e) {}
}

/* ---- RA Bill ---- */
function entryFormRa(){
  if (state.workItems.length===0) return '<div class="empty-note">'+(LANG==="en"?"Add a Work Item under Masters first.":'आधी "मास्टर्स" मध्ये कामाचा प्रकार जोडा.')+'</div>';
  if (!raForm.workItemId) raForm.workItemId = state.workItems[0].id;
  const w = state.workItems.find(x=>x.id===raForm.workItemId);
  const workOpts = state.workItems.map(x=>{ const site=state.sites.find(s=>s.id===x.siteId); return '<option value="'+x.id+'" '+(x.id===raForm.workItemId?"selected":"")+'>'+esc((site?site.name+" · ":"")+x.workName)+'</option>'; }).join("");
  const bills = state.raBills.filter(b=>b.workItemId===w.id).sort((a,b)=>a.billNo-b.billNo);
  const lastBill = bills[bills.length-1];
  const nextBillNo = bills.length ? Math.max(...bills.map(b=>b.billNo))+1 : 1;
  const cq = Number(raForm.cumulativeQty)||0;
  const cumValue = w.rate ? cq*Number(w.rate) : 0;
  const retentionAmt = cumValue*(Number(w.retentionPct)||0)/100;
  const prevPaid = lastBill ? (lastBill.cumulativeValue - lastBill.retentionAmount) : 0;
  const netPayable = (cumValue-retentionAmt)-prevPaid;
  return '<div class="form-card">'
    + '<div class="form-grid2"><div><label class="form-label">'+(LANG==="en"?"Work Item":"कामाचा प्रकार")+'</label><select class="field" onchange="raForm.workItemId=this.value; raForm.cumulativeQty=\'\'; renderEntry();">'+workOpts+'</select></div>'
    + '<div><label class="form-label">'+t("date")+'</label><input class="field" type="date" value="'+raForm.date+'" onchange="raForm.date=this.value;"></div></div>'
    + '<div style="font-size:12px;color:var(--sub);margin-bottom:10px;">RA-'+nextBillNo+' — '+(LANG==="en"?"enter TOTAL work done till date; previous amount is deducted automatically.":"आजपर्यंतचं एकूण (cumulative) काम टाका, आधीचं आपोआप वजा होईल.")+'</div>'
    + '<div style="margin-bottom:14px;"><label class="form-label">'+(LANG==="en"?"Cumulative work ("+ (w.unit||"unit") +")":"आजपर्यंत एकूण काम ("+(w.unit||"युनिट")+")")+'</label><input class="field" type="number" value="'+raForm.cumulativeQty+'" oninput="raForm.cumulativeQty=this.value; renderEntry();"></div>'
    + (w.rate ? '<div style="font-size:12.5px;color:var(--sub);margin-bottom:12px;" class="font-mono">'+(LANG==="en"?"Value":"मूल्य")+': '+inr(cumValue)+' · '+(LANG==="en"?"Retention":"रिटेन्शन")+' ('+w.retentionPct+'%): -'+inr(retentionAmt)+' · '+(LANG==="en"?"Prev paid":"आधी दिलेले")+': -'+inr(prevPaid)+' · <span style="color:var(--ink);font-weight:700;">'+(LANG==="en"?"Payable":"देय")+': '+inr(netPayable)+'</span></div>' : '<div style="font-size:12px;color:var(--red);margin-bottom:12px;">'+(LANG==="en"?"This work item has no rate set — edit it under Masters first.":"या कामाला दर सेट नाही — आधी मास्टर्समध्ये एडिट करा.")+'</div>')
    + '<div style="margin-bottom:14px;"><label class="form-label">'+(LANG==="en"?"Note":"टीप")+' '+t("optional")+'</label><input class="field" value="'+esc(raForm.note)+'" oninput="raForm.note=this.value;"></div>'
    + '<div id="raErr" class="err-text hidden"></div>'
    + '<button class="btn-primary" onclick="submitRaEntry()">'+t("save")+'</button></div>';
}
async function submitRaEntry(){
  const w = state.workItems.find(x=>x.id===raForm.workItemId);
  const errEl=document.getElementById("raErr");
  if (!raForm.cumulativeQty || Number(raForm.cumulativeQty)<=0 || !w.rate){ errEl.textContent=LANG==="en"?"Enter valid quantity (rate must be set on the work item).":"योग्य प्रमाण भरा (कामाला दर सेट असणं आवश्यक)."; errEl.classList.remove("hidden"); return; }
  const bills = state.raBills.filter(b=>b.workItemId===w.id).sort((a,b)=>a.billNo-b.billNo);
  const lastBill = bills[bills.length-1];
  const nextBillNo = bills.length ? Math.max(...bills.map(b=>b.billNo))+1 : 1;
  const cq = Number(raForm.cumulativeQty); const cumValue = cq*Number(w.rate);
  const retentionAmt = cumValue*(Number(w.retentionPct)||0)/100;
  const prevPaid = lastBill ? (lastBill.cumulativeValue-lastBill.retentionAmount) : 0;
  const netPayable = (cumValue-retentionAmt)-prevPaid;
  try { await addRaBill({ workItemId:w.id, billNo:nextBillNo, date:raForm.date, cumulativeQty:cq, cumulativeValue:cumValue, retentionAmount:retentionAmt, previousPaid:prevPaid, netPayable, note:raForm.note }); raForm.cumulativeQty=""; raForm.note=""; renderEntry(); } catch(e){}
}

function setReportTab(k){ state.reportTab=k; state.activeSiteId=null; state.activeSupplierId=null; state.activeCustomerId=null; state.activeWorkId=null; renderReports(); }
function renderReports(){
  const tabs = [["sites",t("reportSites")],["suppliers",t("reportSuppliers")],["stock",t("reportStock")],["sales",t("reportSales")],["progress",t("reportProgress")],["finance",t("reportFinance")],["mach",t("reportMach")],["labor",t("reportLabor")]];
  const sub = subtabsHtml(tabs, state.reportTab, "setReportTab");
  let inner = "";
  if (state.reportTab==="sites") inner = state.activeSiteId ? reportSiteDetail(state.activeSiteId) : reportSitesList();
  else if (state.reportTab==="suppliers") inner = state.activeSupplierId ? reportSupplierDetail(state.activeSupplierId) : reportSuppliersList();
  else if (state.reportTab==="stock") inner = reportStock();
  else if (state.reportTab==="sales") inner = state.activeCustomerId ? reportCustomerDetail(state.activeCustomerId) : reportSales();
  else if (state.reportTab==="progress") inner = state.activeWorkId ? reportWorkDetail(state.activeWorkId) : reportProgress();
  else if (state.reportTab==="finance") inner = reportFinance();
  else if (state.reportTab==="mach") inner = reportMachinery();
  else if (state.reportTab==="labor") inner = reportLabor();
  document.getElementById("bodyInner").innerHTML = sub + inner;
}

/* ---- Sites report ---- */
function reportSitesList(){
  const totals = computeTotals();
  if (state.sites.length===0) return '<div class="empty-note">'+(LANG==="en"?"No sites yet.":"अजून साईट नाही.")+'</div>';
  let inner = '<div class="grid-cards">';
  state.sites.forEach(s=>{
    const tt = totals.perSite.find(p=>p.site.id===s.id) || {amount:0,count:0};
    let budgetBar='';
    if (s.budget){ const pct=Math.round(tt.amount/s.budget*100); const over=tt.amount>s.budget;
      budgetBar='<div style="margin-top:8px;"><div style="background:var(--line);border-radius:4px;height:6px;overflow:hidden;"><div style="width:'+Math.min(100,pct)+'%;height:100%;background:'+(over?"var(--red)":(pct>85?"var(--amber)":"var(--green)"))+';"></div></div><div style="font-size:10.5px;color:'+(over?"var(--red)":"var(--sub)")+';margin-top:3px;">'+(LANG==="en"?"Budget":"बजेट")+' '+inr(s.budget)+' · '+pct+'%'+(over?(LANG==="en"?" over":" ओलांडलं"):'')+'</div></div>'; }
    inner += '<div class="card" onclick="openReportSite(\''+s.id+'\')"><div class="card-title">'+esc(s.name)+'</div><div class="card-sub">'+esc(s.location||"—")+'</div><div class="card-amount" style="color:var(--steel);">'+inr(tt.amount)+'</div><div class="card-count">'+tt.count+' '+(LANG==="en"?"entries":"नोंदी")+'</div>'+budgetBar+'</div>';
  });
  inner += '</div>';
  return sectionHtml(t("reportSites"),"", inner);
}
function openReportSite(id){ state.activeSiteId=id; renderReports(); }
function reportSiteDetail(siteId){
  const site = state.sites.find(s=>s.id===siteId); if(!site) return reportSitesList();

  const total = siteTxns.reduce((a,x)=>a+x.totalAmount,0);
  const actualTotal = allSiteTxns.reduce((a,x)=>a+x.totalAmount,0);
  const directExpense = allSiteTxns.filter(x=>!x.supplierId).reduce((a,x)=>a+x.totalAmount,0);
  const siteUsageValue = state.usage.filter(u=>u.siteId===site.id).reduce((a,u)=>a+Number(u.value||0),0);
  let chips=''; Object.entries(bySupplier).forEach(([supId,amt])=>{ const label=supId==="_direct"?(LANG==="en"?"Direct expense":"थेट खर्च"):((state.suppliers.find(s=>s.id===supId)||{}).name||"—"); chips+='<div class="chip"><b>'+esc(label)+'</b> <span class="amt">'+inr(amt)+'</span></div>'; });
  let budgetHtml='';

    budgetHtml='<div style="margin-bottom:18px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:4px;"><span>'+(LANG==="en"?"Budget":"बजेट")+': '+inr(site.budget)+' · '+(LANG==="en"?"Spent":"खर्च")+': '+inr(actualTotal)+'</span><span style="color:'+(over?"var(--red)":"var(--ink)")+';font-weight:600;">'+pct+'%'+(over?(LANG==="en"?" — over budget!":" — बजेट ओलांडलं!"):'')+'</span></div><div style="background:var(--line);border-radius:4px;height:10px;overflow:hidden;"><div style="width:'+Math.min(100,pct)+'%;height:100%;background:'+(over?"var(--red)":(pct>85?"var(--amber)":"var(--green)"))+';"></div></div></div>'; }
  let infoFlags='<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;">'
    + '<span style="color:var(--sub);">'+(LANG==="en"?"Includes material bills + labor + direct expenses.":"यात मटेरियल बिलं + मजुरी + थेट खर्च — सगळं धरून एकूण.")+'</span>'
    + (directExpense>0?'<span style="color:var(--steel);font-weight:600;">🧾 '+(LANG==="en"?"Direct expense":"थेट खर्च")+': '+inr(directExpense)+'</span>':'')
    + (siteUsageValue>0?'<span style="color:var(--amber);font-weight:600;">📦 '+(LANG==="en"?"Material used value":"वापरलेल्या साहित्याचं मूल्य")+': '+inr(siteUsageValue)+'</span>':'')
    + '</div>';
  return '<button class="back-btn no-print" onclick="openReportSite(null)">‹ '+t("reportSites")+'</button>'
    + printHeaderHtml(site.name, t("reportSites"))
    + sectionHtml(site.name, site.location||"", budgetHtml+infoFlags+filterBarHtml()+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">'+chips+'</div>'+txnTableHtml(siteTxns,false),
        '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><button class="print-btn no-print" onclick="exportCSV(state.txns.filter(t=>t.siteId===\''+site.id+'\'),\''+esc(site.name)+'\')">⬇ CSV</button>'+printBtnHtml()+'<div style="text-align:right;"><div style="font-size:10.5px;color:var(--sub);text-transform:uppercase;">'+(LANG==="en"?"Total":"एकूण")+'</div><div class="font-display" style="font-size:22px;font-weight:600;color:var(--orange);">'+inr(total)+'</div></div></div>');

  if (advanceTotal>0) flags+='<div style="display:flex;align-items:center;gap:6px;color:var(--steel);font-size:13px;font-weight:600;">💰 '+(LANG==="en"?"Advance given":"दिलेला ॲडव्हान्स")+': '+inr(advanceTotal)+'</div>';
  if (advanceTotal>0||pending>0) flags+='<div style="display:flex;align-items:center;gap:6px;color:'+(netPayable>0?"var(--red)":"var(--green)")+';font-size:13px;font-weight:700;">⚖ '+(LANG==="en"?"Net payable":"निव्वळ देय")+': '+inr(Math.max(0,netPayable))+(netPayable<0?' ('+(LANG==="en"?"overpaid":"जास्त दिलंय")+': '+inr(-netPayable)+')':'')+'</div>';
  if (gstTotal>0) flags+='<div style="display:flex;align-items:center;gap:6px;color:var(--amber);font-size:13px;font-weight:600;">🧾 GST: '+inr(gstTotal)+'</div>';
  flags+='</div>';
  let advList=''; supAdvances.forEach(a=>{ const site=state.sites.find(s=>s.id===a.siteId); advList+='<div class="list-row"><div><span style="font-weight:600;font-size:13px;">'+inr(a.amount)+'</span> <span style="font-size:11.5px;color:var(--sub);">· '+esc(a.date)+(site?' · '+esc(site.name):'')+' · '+esc(modeLabel(a.mode))+'</span></div><button class="icon-btn" onclick="deleteAdvance(\''+a.id+'\')">🗑</button></div>'; });
  const advanceSection = advList ? sectionHtml(t("typeAdvance"),"", '<div class="list-panel">'+advList+'</div>') : '';

    + printHeaderHtml(supplier.name, t("reportSuppliers"))

        '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><button class="print-btn no-print" onclick="exportCSV(state.txns.filter(t=>t.supplierId===\''+supplier.id+'\'),\''+esc(supplier.name)+'\')">⬇ CSV</button>'+printBtnHtml()+'<div class="font-display" style="font-size:22px;font-weight:600;color:var(--orange);">'+inr(total)+'</div></div>')
    + '<div class="no-print">'+advanceSection+'</div>';

/* ---- Stock report (read-only balance) ---- */
function reportStock(){
  const stock = computeStock();
  let balanceHtml='';
  state.sites.forEach(site=>{
    const items=stock[site.id]; if(!items||Object.keys(items).length===0) return;
    let rows=''; Object.values(items).forEach(it=>{
      const balance=it.purchased-it.used; const color=balance<0?"var(--red)":(balance===0?"var(--sub)":"var(--green)");
      rows += '<div class="list-row"><div style="flex:1;"><span style="font-weight:600;font-size:13.5px;">'+esc(it.display)+'</span> <span style="font-size:11.5px;color:var(--sub);">'+(LANG==="en"?"Purchased":"खरेदी")+': '+it.purchased+' '+esc(it.unit)+' · '+(LANG==="en"?"Used":"वापर")+': '+it.used+' '+esc(it.unit)+(it.usedValue?' ('+inr(it.usedValue)+')':'')+'</span></div><div class="font-mono" style="font-weight:700;color:'+color+';">'+balance+' '+esc(it.unit)+'</div></div>';
    });
    balanceHtml += '<div style="margin-bottom:18px;"><div style="font-weight:600;font-size:14px;color:var(--ink);margin-bottom:6px;">'+esc(site.name)+'</div><div class="list-panel">'+rows+'</div></div>';
  });
  if (!balanceHtml) balanceHtml = '<div class="empty-note">'+(LANG==="en"?'No stock data yet. Add item name + quantity while entering a Purchase, or record Material Usage.':'अजून स्टॉक डेटा नाही. "नोंद करा" मध्ये खरेदी करताना साहित्याचं नाव/प्रमाण भरा, किंवा साहित्य वापर नोंदवा.')+'</div>';
  const totalUsageValue = state.usage.reduce((a,u)=>a+Number(u.value||0),0);
  const usageValueStat = totalUsageValue>0 ? '<div class="stat-row" style="margin-bottom:16px;">'+statCard(LANG==="en"?"Total material used value":"वापरलेल्या साहित्याचं एकूण मूल्य","₹"+totalUsageValue.toLocaleString("en-IN"),"--amber","📦")+'</div>' : '';
  return usageValueStat + sectionHtml(t("reportStock"), LANG==="en"?"Purchased − Used, site-wise":"खरेदी − वापर, साईट-वाईज", balanceHtml);
}

/* ---- Sales report ---- */
function reportSales(){
  const totalSalesValue = state.customers.reduce((a,c)=>a+c.agreementValue,0);
  const totalReceived = state.receipts.reduce((a,r)=>a+r.amount,0);
  const totalReceivable = totalSalesValue-totalReceived;
  const summary = '<div class="stat-row" style="margin-bottom:20px;">'
    + statCard(LANG==="en"?"Total Sales Value":"एकूण विक्री मूल्य", inr(totalSalesValue), "--orange", "🏠")
    + statCard(LANG==="en"?"Total Received":"एकूण जमा", inr(totalReceived), "--green", "💰")

  });
  const custSection = sectionHtml(t("mastersCustomers"),"", custRows?'<div class="list-panel">'+custRows+'</div>':'<div class="empty-note">'+(LANG==="en"?"No customers yet.":"अजून कस्टमर नाही.")+'</div>');
  // units status
  let unitRows='';
  state.sites.forEach(site=>{ const su=state.units.filter(u=>u.siteId===site.id); if(!su.length) return;
    unitRows += '<div style="font-weight:600;font-size:13.5px;margin:10px 0 6px 0;">'+esc(site.name)+'</div><div class="list-panel" style="margin-bottom:10px;">';
    su.forEach(u=>{ const color = u.status==="available"?"var(--green)":u.status==="booked"?"var(--amber)":"var(--steel)"; unitRows += '<div class="list-row"><div><span style="font-weight:600;font-size:13.5px;">'+esc(u.unitNo)+'</span> <span style="font-size:11.5px;color:var(--sub);">'+esc(u.unitType||"")+(u.price?' · '+inr(u.price):'')+'</span></div><span style="color:'+color+';font-weight:700;font-size:12px;">'+STATUS_LABEL[u.status]+'</span></div>'; });
    unitRows += '</div>';
  });
  const unitSection = sectionHtml(t("mastersUnits"),"", unitRows||'<div class="empty-note">'+(LANG==="en"?"No units yet.":"अजून युनिट नाही.")+'</div>');
  return summary + custSection + unitSection;
}

      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;">'
      + '<span style="color:var(--green);font-weight:600;">'+(LANG==="en"?"Received":"जमा")+': '+inr(received)+'</span>'
      + '<span style="color:'+(due>0?"var(--red)":"var(--green)")+';font-weight:700;">'+(due>0?(LANG==="en"?"Due: ":"बाकी: ")+inr(due):(LANG==="en"?"Fully paid ✓":"पूर्ण भरलं ✓"))+'</span>'
      + (c.contact?'<span style="color:var(--sub);">📞 '+esc(c.contact)+'</span>':'')+'</div>'
      + (rRows?'<div class="list-panel">'+rRows+'</div>':'<div style="color:var(--sub);font-size:13px;">'+(LANG==="en"?"No receipts yet — add one from Entry → Customer Receipt.":'अजून पावती नाही — "नोंद करा" → "ग्राहक पावती" मधून टाका.')+'</div>'));
}

/* ---- Progress report ---- */
function reportProgress(){
  let rows='';
  state.sites.forEach(site=>{
    const items=state.workItems.filter(w=>w.siteId===site.id); if(!items.length) return;
    rows += '<div style="font-weight:600;font-size:13.5px;margin:10px 0 6px 0;">'+esc(site.name)+'</div><div class="grid-cards" style="margin-bottom:10px;">';
    items.forEach(w=>{
      const contractor=state.suppliers.find(s=>s.id===w.contractorId);
      const bills=state.raBills.filter(b=>b.workItemId===w.id).sort((a,b)=>b.billNo-a.billNo); const latest=bills[0];
      const pct=(w.totalQty&&latest)?Math.round(latest.cumulativeQty/w.totalQty*100):null;
      rows += '<div class="card" onclick="openReportWork(\''+w.id+'\')"><div class="card-title">'+esc(w.workName)+'</div><div class="card-sub">'+(contractor?esc(contractor.name):(LANG==="en"?"No contractor":"कॉन्ट्रॅक्टर नाही"))+(w.rate?' · ₹'+w.rate+'/'+esc(w.unit||""):'')+'</div>'
        + (pct!=null?'<div style="background:var(--line);border-radius:4px;height:8px;overflow:hidden;margin:8px 0 4px 0;"><div style="width:'+Math.min(100,pct)+'%;height:100%;background:'+(pct>=100?"var(--green)":"var(--orange)")+';"></div></div><div style="font-size:11.5px;color:var(--sub);">'+pct+'% '+(LANG==="en"?"complete":"पूर्ण")+'</div>':'<div class="card-count" style="margin-top:8px;">'+bills.length+' RA</div>')
        + '</div>';
    });
    rows += '</div>';
  });
  if (!rows) rows = '<div class="empty-note">'+(LANG==="en"?"No work items yet — add under Masters.":'अजून कामाचा प्रकार नाही — "मास्टर्स" मध्ये जोडा.')+'</div>';
  return sectionHtml(t("reportProgress"),"", rows);
}
function openReportWork(id){ state.activeWorkId=id; renderReports(); }
function reportWorkDetail(workId){
  const w=state.workItems.find(x=>x.id===workId); if(!w) return reportProgress();
  const site=state.sites.find(s=>s.id===w.siteId); const contractor=state.suppliers.find(s=>s.id===w.contractorId);
  const bills=state.raBills.filter(b=>b.workItemId===w.id).sort((a,b)=>a.billNo-b.billNo);
  const lastBill=bills[bills.length-1]; const pct=(w.totalQty&&lastBill)?Math.round(lastBill.cumulativeQty/w.totalQty*100):null;
  let progressHtml=''; if(pct!=null){ progressHtml='<div style="margin-bottom:14px;"><div style="background:var(--line);border-radius:4px;height:10px;overflow:hidden;"><div style="width:'+Math.min(100,pct)+'%;height:100%;background:'+(pct>=100?"var(--green)":"var(--orange)")+';"></div></div><div style="font-size:12.5px;color:var(--sub);margin-top:4px;">'+pct+'% ('+lastBill.cumulativeQty+' / '+w.totalQty+' '+esc(w.unit||"")+')</div></div>'; }
  let billRows='';
  bills.slice().reverse().forEach(b=>{ billRows += '<div class="list-row"><div><span style="font-weight:600;font-size:13px;">RA-'+b.billNo+'</span> <span style="font-size:11.5px;color:var(--sub);">· '+esc(b.date)+' · '+b.cumulativeQty+' '+esc(w.unit||"")+' · '+inr(b.netPayable)+'</span></div><div style="display:flex;align-items:center;gap:8px;">'+stampHtml(b.status)+(b.status==="pending"?'<button class="icon-btn" style="color:var(--green);font-weight:700;" onclick="markRaPaid(\''+b.id+'\')">✓</button>':'')+'<button class="icon-btn" onclick="deleteRaBill(\''+b.id+'\')">🗑</button></div></div>'; });
  return '<button class="back-btn" onclick="openReportWork(null)">‹ '+t("reportProgress")+'</button>'
    + sectionHtml(w.workName, (site?site.name+' · ':'')+(contractor?contractor.name:(LANG==="en"?"No contractor":"कॉन्ट्रॅक्टर नाही")), progressHtml+(billRows?'<div class="list-panel">'+billRows+'</div>':'<div style="color:var(--sub);font-size:13px;">'+(LANG==="en"?'No RA bills yet — add one from Entry → RA Bill.':'अजून RA बिल नाही — "नोंद करा" → "RA बिल" मधून टाका.')+'</div>'));
}

/* ---- Finance report ---- */
function reportFinance(){
  const amt = x => Number(x.totalAmount||0);
  const totalExpenseAll = state.txns.reduce((a,x)=>a+amt(x),0);
  const paidExpense = state.txns.filter(x=>x.status==="paid").reduce((a,x)=>a+amt(x),0);
  const pendingExpense = state.txns.filter(x=>x.status==="pending").reduce((a,x)=>a+amt(x),0);
  const raTotal=state.raBills.reduce((a,b)=>a+b.netPayable,0); const raPaid=state.raBills.filter(b=>b.status==="paid").reduce((a,b)=>a+b.netPayable,0); const raPending=state.raBills.filter(b=>b.status==="pending").reduce((a,b)=>a+b.netPayable,0);
  const machTotal=state.machinery.reduce((a,m)=>a+m.totalCost,0); const machPaid=state.machinery.filter(m=>m.status==="paid").reduce((a,m)=>a+m.totalCost,0); const machPending=state.machinery.filter(m=>m.status==="pending").reduce((a,m)=>a+m.totalCost,0);
  const laborTotal=state.labor.reduce((a,l)=>a+l.wageAmount,0); const laborPaid=state.labor.filter(l=>l.status==="paid").reduce((a,l)=>a+l.wageAmount,0); const laborPending=state.labor.filter(l=>l.status==="pending").reduce((a,l)=>a+l.wageAmount,0);
  const totalCost=totalExpenseAll+raTotal+machTotal+laborTotal;
  const totalPaidOut=paidExpense+raPaid+machPaid+laborPaid;
  const totalPayable=pendingExpense+raPending+machPending+laborPending;
  const totalRevenue=state.customers.reduce((a,c)=>a+c.agreementValue,0);
  const totalReceived=state.receipts.reduce((a,r)=>a+r.amount,0);
  const totalReceivable=totalRevenue-totalReceived;
  const totalAdvances=state.advances.reduce((a,x)=>a+x.amount,0);
  const netProfit=totalRevenue-totalCost; const netCashFlow=totalReceived-totalPaidOut-totalAdvances;
  const note='<div style="font-size:12px;color:var(--sub);margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;">'+(LANG==="en"?"Auto-computed from your entries. Profit is accrual-based (includes unpaid bills). Don't log the same contractor payment both as a Purchase entry and an RA bill.":"आधीच्या नोंदींवरून आपोआप. नफा accrual-based आहे. एकाच पेमेंटची नोंद खरेदी-एन्ट्री आणि RA बिल दोन्हीकडे करू नका.")+'</div>';
  const plSection='<div class="stat-row" style="margin-bottom:14px;">'
    + statCard(LANG==="en"?"Total Revenue":"एकूण विक्री", inr(totalRevenue), "--orange", "🏠")
    + statCard(LANG==="en"?"Total Cost":"एकूण खर्च", inr(totalCost), "--steel", "🧾")
    + statCard(LANG==="en"?"Est. Profit/Loss":"अंदाजे नफा/तोटा", (netProfit>=0?"+":"")+inr(netProfit), netProfit>=0?"--green":"--red", netProfit>=0?"📈":"📉")
    + '</div>';
  const cashSection='<div class="stat-row" style="margin-bottom:14px;">'
    + statCard(LANG==="en"?"Received":"जमा", inr(totalReceived), "--green", "💰")
    + statCard(LANG==="en"?"Paid Out":"भरलेले", inr(totalPaidOut), "--red", "💸")
    + statCard(LANG==="en"?"Advances Given":"दिलेला ॲडव्हान्स", inr(totalAdvances), "--amber", "🤝")
    + statCard(LANG==="en"?"Net Cash Flow":"निव्वळ कॅश फ्लो", (netCashFlow>=0?"+":"")+inr(netCashFlow), netCashFlow>=0?"--green":"--red", "🏦")
    + '</div>';
  const outstandingSection='<div class="stat-row" style="margin-bottom:20px;">'
    + statCard(LANG==="en"?"Receivable":"येणे बाकी", inr(Math.max(0,totalReceivable)), "--red", "⏳")
    + statCard(LANG==="en"?"Payable":"देणे बाकी", inr(totalPayable), "--amber", "⚠")
    + '</div>';
  let siteRows='';
  if (state.sites.length){
    siteRows += '<div class="txn-table-wrap"><div style="min-width:600px;"><div class="txn-head" style="grid-template-columns:1.3fr 1fr 1fr 1fr;"><div>'+t("site")+'</div><div class="right">'+(LANG==="en"?"Revenue":"विक्री")+'</div><div class="right">'+(LANG==="en"?"Cost":"खर्च")+'</div><div class="right">'+(LANG==="en"?"P/L":"नफा/तोटा")+'</div></div>';
    state.sites.forEach(site=>{
      const siteUnitIds=state.units.filter(u=>u.siteId===site.id).map(u=>u.id);
      const siteRevenue=state.customers.filter(c=>siteUnitIds.includes(c.unitId)).reduce((a,c)=>a+c.agreementValue,0);
      const siteTxnCost=state.txns.filter(x=>x.siteId===site.id).reduce((a,x)=>a+amt(x),0);
      const siteWorkIds=state.workItems.filter(w=>w.siteId===site.id).map(w=>w.id);
      const siteRaCost=state.raBills.filter(b=>siteWorkIds.includes(b.workItemId)).reduce((a,b)=>a+b.netPayable,0);
      const siteMachCost=state.machinery.filter(m=>m.siteId===site.id).reduce((a,m)=>a+m.totalCost,0);
      const siteLaborCost=state.labor.filter(l=>l.siteId===site.id).reduce((a,l)=>a+l.wageAmount,0);
      const siteCost=siteTxnCost+siteRaCost+siteMachCost+siteLaborCost; const siteProfit=siteRevenue-siteCost;
      siteRows += '<div class="txn-row" style="grid-template-columns:1.3fr 1fr 1fr 1fr;"><div class="name">'+esc(site.name)+'</div><div class="right">'+inr(siteRevenue)+'</div><div class="right">'+inr(siteCost)+'</div><div class="right" style="font-weight:700;color:'+(siteProfit>=0?"var(--green)":"var(--red)")+';">'+(siteProfit>=0?"+":"")+inr(siteProfit)+'</div></div>';
    });
    siteRows += '</div></div>';
  } else siteRows = '<div class="empty-note">'+(LANG==="en"?"Add sites to see site-wise P&L.":"साईट जोडा — नफा/तोटा इथे दिसेल.")+'</div>';
  return note+plSection+cashSection+sectionHtml(LANG==="en"?"Outstanding":"येणे-देणे","", outstandingSection)+sectionHtml(LANG==="en"?"Site-wise P&L":"साईट-वाईज नफा/तोटा","", siteRows);
}

/* ---- Machinery / Labor logs (read-only, quick mark-paid) ---- */
function reportMachinery(){
  let rows=''; state.machinery.forEach(m=>{ const site=state.sites.find(s=>s.id===m.siteId); rows+='<div class="list-row"><div><span style="font-weight:600;font-size:13px;">'+esc(m.machineName)+'</span> <span style="font-size:11.5px;color:var(--sub);">· '+esc(site?site.name:"—")+' · '+esc(m.date)+' · '+inr(m.totalCost)+'</span></div><div style="display:flex;align-items:center;gap:8px;">'+stampHtml(m.status)+(m.status==="pending"?'<button class="icon-btn" style="color:var(--green);font-weight:700;" onclick="markMachineryPaid(\''+m.id+'\')">✓</button>':'')+'<button class="icon-btn" onclick="deleteMachinery(\''+m.id+'\')">🗑</button></div></div>'; });
  const pendingTotal = state.machinery.filter(m=>m.status==="pending").reduce((a,m)=>a+m.totalCost,0);
  const stat = pendingTotal>0 ? '<div class="stat-row" style="margin-bottom:16px;">'+statCard(LANG==="en"?"Pending":"पेंडिंग", inr(pendingTotal), "--red", "⚠")+'</div>' : '';
  return stat + sectionHtml(t("reportMach"),"", rows?'<div class="list-panel">'+rows+'</div>':'<div class="empty-note">'+(LANG==="en"?"No entries yet.":"अजून नोंद नाही.")+'</div>');
}
function reportLabor(){
  let rows=''; state.labor.forEach(l=>{ const site=state.sites.find(s=>s.id===l.siteId); rows+='<div class="list-row"><div><span style="font-weight:600;font-size:13px;">'+esc(l.workerName)+'</span> <span style="font-size:11.5px;color:var(--sub);">'+(l.category?'· '+esc(l.category)+' ':'')+'· '+esc(site?site.name:"—")+' · '+esc(l.date)+' · '+l.days+'d · '+inr(l.wageAmount)+'</span></div><div style="display:flex;align-items:center;gap:8px;">'+stampHtml(l.status)+(l.status==="pending"?'<button class="icon-btn" style="color:var(--green);font-weight:700;" onclick="markLaborPaid(\''+l.id+'\')">✓</button>':'')+'<button class="icon-btn" onclick="deleteLabor(\''+l.id+'\')">🗑</button></div></div>'; });
  const pendingTotal = state.labor.filter(l=>l.status==="pending").reduce((a,l)=>a+l.wageAmount,0);
  const stat = pendingTotal>0 ? '<div class="stat-row" style="margin-bottom:16px;">'+statCard(LANG==="en"?"Unpaid wages":"न दिलेली मजुरी", inr(pendingTotal), "--red", "⚠")+'</div>' : '';
  return stat + sectionHtml(t("reportLabor"),"", rows?'<div class="list-panel">'+rows+'</div>':'<div class="empty-note">'+(LANG==="en"?"No entries yet.":"अजून नोंद नाही.")+'</div>');
}
</script>
